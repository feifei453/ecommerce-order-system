server:
  port: 8085

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3307/mall?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
    druid:
      initial-size: 5
      min-idle: 10
      max-active: 20
      web-stat-filter:
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*"
      stat-view-servlet:
        login-username: druid
        login-password: druid
  data:
    mongodb:
      host: 127.0.0.1
      port: 27018
      database: mall-port
  redis:
    host: 127.0.0.1
    database: 0
    port: 6381
    password:
    timeout: 300ms
  rabbitmq:
    host: 127.0.0.1
    port: 5673
    virtual-host: /mall
    username: mall
    password: mall

mongo:
  insert:
    sqlEnable: true

logging:
  level:
    root: info
    com.macro.mall: debug

logstash:
  host: 127.0.0.1
  enableInnerLog: false

alipay:
  gatewayUrl: https://openapi-sandbox.dl.alipaydev.com/gateway.do
  appId: your appId
  alipayPublicKey: your alipayPublicKey
  appPrivateKey: your appPrivateKey
  returnUrl: http://127.0.0.1:8060/#/pages/money/paySuccess
  notifyUrl:
