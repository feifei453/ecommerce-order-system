server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3307/mall?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
    druid:
      initial-size: 5
      min-idle: 10
      max-active: 20
      web-stat-filter:
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*"
      stat-view-servlet:
        login-username: druid
        login-password: druid
  redis:
    host: 127.0.0.1
    database: 0
    port: 6381
    password:
    timeout: 300ms

minio:
  endpoint: http://127.0.0.1:9091
  bucketName: mall
  accessKey: minioadmin
  secretKey: minioadmin

logging:
  level:
    root: info
    com.macro.mall: debug

logstash:
  host: 127.0.0.1
  enableInnerLog: false
